version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: family-tree-postgres
    environment:
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: familytree_secret
      POSTGRES_DB: familytree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
