version: '3.8'

# Production stack: postgres + backend + frontend + nginx reverse proxy.
# All services restart automatically unless explicitly stopped.
#
# Usage:
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml up -d --build

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-familytree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-familytree}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familytree} -d ${POSTGRES_DB:-familytree}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend (Express / Prisma) ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      # Override DATABASE_URL to use the service name instead of localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-familytree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-familytree}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── Frontend (React/Vite static build served by nginx) ───────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped

  # ── Nginx reverse proxy (public entry point) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # ── Certbot (TLS certificate issuance and renewal) ────────────────────────────
  # Inactive until you run the one-time issuance command (see README).
  # After that it auto-renews every 12 hours.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  # Shared with docker-compose.dev.yml so dev data carries into prod
  postgres_data:
  uploads_data:
  letsencrypt_data:
  certbot_www:
