# ── Rate limiting zone (login endpoint) ───────────────────────────────────────
# 10 requests/min per IP; burst of 5 allows brief spikes without error.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# ── Upstreams ─────────────────────────────────────────────────────────────────
upstream backend {
    server backend:3001;
}

upstream frontend {
    server frontend:80;
}

# ── Gzip ──────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# ── HTTP server ───────────────────────────────────────────────────────────────
# On first deploy this serves the app over plain HTTP.
# After obtaining a TLS certificate (see README → Enabling HTTPS), replace the
# proxy locations below with a single `return 301 https://$host$request_uri;`
# and uncomment the HTTPS server block further down.
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge — must remain reachable over HTTP even after
    # TLS is enabled (certbot renewal uses this path).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-Frame-Options           "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; worker-src blob:; frame-ancestors 'none'; base-uri 'self';"
        always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass            http://backend;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
        add_header            Cache-Control "no-store" always;
    }

    location /uploads/ {
        proxy_pass         http://backend;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=604800, immutable" always;
    }

    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

