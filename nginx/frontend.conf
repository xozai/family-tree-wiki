# nginx config inside the frontend container.
# Serves the compiled React/Vite SPA and handles client-side routing.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets (JS, CSS, fonts, images) — long-lived immutable cache
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML entry point — no cache so deploys take effect immediately
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }
}
